# thekonnen/.github/repo-groups.yml
# Read and written by the "Repository Group for Github" browser extension.
# Lives in the org's `.github` repository, so every member sees the same groups.
#
# Placement rules (see CLAUDE.md → "Placement algorithm"):
#   1. An exact repository name in `match` always wins.
#   2. Otherwise patterns with `*` are tried; the deepest matching group wins.
#   3. Repositories that match nothing are shown as "Ungrouped".
#
# Pinned repos and order (C5), optional on any group:
#   pinned: ["dagsrv"]   exact repo names shown first, in this order (only repos placed in the group count)
#   sort: name          pushed (default) | name | stars | issues
#
# Teams (CLAUDE.md → F12):
#   - A plain slug means that team gets "push" (Write).
#   - Use { slug, permission } for pull | triage | push | maintain | admin.
#   - Subgroups inherit their parents' teams; the closest definition of a slug wins.
#   - "Sync access" only adds or raises access. It never removes or lowers it.
version: 1
# index: action   # optional (F14): use repo-index.json from the GitHub Action. Off by default.
groups:
  - name: infra
    description: "Self-hosted platform services"
    teams: ["core_team"]                       # Write on everything under infra
    groups:
      - name: dagsrv
        description: "Jobs and crons (Airflow alternative)"
        logo: "logos/infra-dagsrv.png"             # file committed next to this YAML
        match: ["dagsrv", "dags-*", "kite-dagsrv"]
      - name: authn
        description: "SSO and identity"
        match: ["*authn*"]
      - name: cmonitor
        description: "Uptime monitoring"
        match: ["*cmonitor*"]
  - name: ai
    description: "LLM gateways and routing"
    teams: [{ slug: "ai-squad", permission: "maintain" }]           # example team
    match: ["oroute"]
    groups:
      - name: llm-proxy
        description: "Gateway proxy and the Acme deployment"
        teams: [{ slug: "core_team", permission: "pull" }]        # Read only, plus ai-squad from the parent
        match: ["*llm-proxy*"]
